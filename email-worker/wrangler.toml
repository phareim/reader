name = "reader-email"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Secrets (wrangler secret put …):
#   EMAIL_INGEST_KEY — must equal the Reader Worker's NUXT_EMAIL_INGEST_KEY

[vars]
READER_API_URL = "https://reader.phareim.no"

# Persist console.* to Workers Logs (dashboard → Workers → reader-email →
# Logs) so rejections are inspectable after the fact, not only via
# `wrangler tail`. Free-plan retention is short (~3 days) but beats nothing.
[observability]
enabled = true
