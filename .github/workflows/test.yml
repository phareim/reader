name: Tests

# Runs the suite on pull requests so a change is judged before it reaches main.
# The deploy workflows re-run it as the actual gate — this one just gives PRs
# (notably Dependabot's) a verdict.

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - run: npm test
