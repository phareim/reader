name: Deploy email worker

on:
  push:
    branches: [main]
    paths:
      - 'email-worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Worker's sender-auth alignment logic (email-worker/src/authResults.ts)
      # is covered by the ROOT suite, __tests__/server/emailIngest.test.ts — so
      # gate this deploy on it too.
      - run: npm install

      - run: npm test

      - run: npm install
        working-directory: email-worker

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: email-worker
          command: deploy
